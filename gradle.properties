# medownloader gradle properties

# JDK is discovered from JAVA_HOME or the gradle toolchain.
# (Do not hardcode org.gradle.java.home here — it breaks CI and anyone whose
# JDK is managed by mise/sdkman/asdf/etc.)

# performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# android
android.useAndroidX=true
kotlin.code.style=official
